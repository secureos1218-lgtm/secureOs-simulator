<!-- Floating Trigger Button -->
<button class="copilot-fab" id="copilotFab" title="Open SecurOS AI Assistant">
  🤖
</button>

<!-- Slide-Over Chat Drawer -->
<div class="copilot-drawer" id="copilotDrawer">
  <div class="copilot-header">
    <div>
      <h3>SecurOS AI Assistant</h3>
      <small>SOC Telemetry & Knowledge Engine</small>
    </div>
    <button class="copilot-close" id="copilotClose">&times;</button>
  </div>
  
  <div class="copilot-body" id="copilotBody">
    <div class="copilot-msg bot">
      Hello! I am your SecurOS AI Security Assistant. Ask me anything about cybersecurity concepts, or request an analysis of your latest scan findings!
    </div>
  </div>

  <div class="copilot-footer">
    <input type="text" id="copilotInput" placeholder="Ask a question or explain scan..." />
    <button id="copilotSend">Send</button>
  </div>
</div>

<style>
  .copilot-fab {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #08c9ec, #087c99);
    border: none;
    color: #fff;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(8, 201, 236, 0.35);
    z-index: 1000;
    transition: transform 0.2s;
  }
  .copilot-fab:hover { transform: scale(1.08); }

  .copilot-drawer {
    position: fixed;
    bottom: 90px;
    right: 24px;
    width: 380px;
    height: 520px;
    background: #09172a;
    border: 1px solid #213650;
    border-radius: 12px;
    display: none;
    flex-direction: column;
    z-index: 1000;
    box-shadow: 0 12px 36px rgba(0,0,0,0.5);
    overflow: hidden;
  }

  .copilot-header {
    padding: 16px;
    background: #06111f;
    border-bottom: 1px solid #213650;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .copilot-header h3 { margin: 0; font-size: 15px; color: #fff; }
  .copilot-header small { color: #8899a6; font-size: 11px; }
  .copilot-close { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }

  .copilot-body {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    font-size: 13px;
  }

  .copilot-msg {
    padding: 10px 14px;
    border-radius: 8px;
    max-width: 85%;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .copilot-msg.bot { background: #0e223b; color: #d0e1f9; align-self: flex-start; border: 1px solid #1c3654; }
  .copilot-msg.user { background: #087c99; color: #fff; align-self: flex-end; }

  .copilot-footer {
    padding: 12px;
    background: #06111f;
    border-top: 1px solid #213650;
    display: flex;
    gap: 8px;
  }
  .copilot-footer input {
    flex: 1;
    height: 38px;
    background: #0a1727;
    border: 1px solid #213650;
    border-radius: 6px;
    color: #fff;
    padding: 0 10px;
    outline: none;
  }
  .copilot-footer button {
    height: 38px;
    padding: 0 14px;
    background: #08c9ec;
    border: none;
    border-radius: 6px;
    color: #000;
    font-weight: 600;
    cursor: pointer;
  }
</style>

<script>
  (function() {
    const fab = document.getElementById("copilotFab");
    const drawer = document.getElementById("copilotDrawer");
    const closeBtn = document.getElementById("copilotClose");
    const sendBtn = document.getElementById("copilotSend");
    const input = document.getElementById("copilotInput");
    const body = document.getElementById("copilotBody");

    fab.onclick = () => {
      drawer.style.display = drawer.style.display === "flex" ? "none" : "flex";
    };
    closeBtn.onclick = () => drawer.style.display = "none";

    async function handleSend() {
      const text = input.value.trim();
      if (!text) return;

      const userDiv = document.createElement("div");
      userDiv.className = "copilot-msg user";
      userDiv.textContent = text;
      body.appendChild(userDiv);
      input.value = "";
      body.scrollTop = body.scrollHeight;

      const botDiv = document.createElement("div");
      botDiv.className = "copilot-msg bot";
      botDiv.textContent = "Analyzing query...";
      body.appendChild(botDiv);

      try {
        const response = await fetch("/api/assistant/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: text })
        });
        const data = await response.json();
        botDiv.textContent = data.answer || "No response received.";
      } catch (err) {
        botDiv.textContent = "Error contacting AI Assistant.";
      }
      body.scrollTop = body.scrollHeight;
    }

    sendBtn.onclick = handleSend;
    input.onkeypress = (e) => { if (e.key === "Enter") handleSend(); };
  })();
</script>
